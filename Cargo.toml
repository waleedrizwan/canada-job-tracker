[package]
name = "canada-job-tracker"
version = "0.2.0"
edition = "2024"
description = "Server-rendered dashboard of Canadian job postings from Job Bank open data and StatCan vacancy estimates"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
encoding_rs = "0.8"
maud = "0.27"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "fs"] }
tower-http = { version = "0.6", features = ["compression-gzip", "compression-br"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
