# Keeps the live site on Cloudflare current. Every day it checks whether Job Bank or StatCan has
# published new data; if so, it commits the new data/jobs.json, rebuilds the site and deploys it.
# Pushes to main redeploy as well. Deploying needs the CLOUDFLARE_API_TOKEN secret (see README).
name: Update data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 11 * * *" # daily, 11:30 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 9fc60c2dc4a44e08848615050fb51eac
    steps:
      - uses: actions/checkout@v5
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Download new data, if any
        if: github.event_name != 'push'
        run: cargo run --release -- update

      - name: Commit new data
        id: data
        run: |
          if git diff --quiet data/jobs.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update data to $(jq -r .asOf data/jobs.json)" data/jobs.json
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and deploy
        if: env.CLOUDFLARE_API_TOKEN != '' && (github.event_name != 'schedule' || steps.data.outputs.changed == 'true')
        run: |
          npm ci
          npm run deploy

      - name: Note the missing token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::Not deployed. Add a CLOUDFLARE_API_TOKEN repository secret to deploy to Cloudflare."
