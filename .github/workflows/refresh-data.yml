name: Refresh data

# Job Bank publishes the previous month's postings early each month;
# StatCan updates vacancies quarterly. Checking weekly picks both up.
on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-data.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet data/; then echo "No new data"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          git commit -m "Refresh Job Bank and StatCan data"
          git push
