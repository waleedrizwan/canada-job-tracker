# Keeps the live site current. Every day it checks whether Job Bank or StatCan has published new
# data; if so, it commits the new data/jobs.json to main. Cloudflare (Workers Builds, connected to
# this repo) rebuilds and deploys the site on every push to main, including that one.
name: Update data

on:
  schedule:
    - cron: "30 11 * * *" # daily, 11:30 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

      # open.canada.ca has outages, so try a few times, 10 minutes apart, before failing.
      # Each try is capped at 20 minutes in case a download hangs.
      - name: Download new data, if any
        run: |
          for attempt in 1 2 3 4; do
            timeout 20m target/release/canada-job-tracker update && exit 0
            if [ "$attempt" -lt 4 ]; then
              echo "::warning::Try $attempt of 4 failed; trying again in 10 minutes."
              sleep 600
            fi
          done
          echo "::error::Couldn't reach the data sources after 4 tries. Tomorrow's run will try again."
          exit 1

      - name: Commit new data
        run: |
          if git diff --quiet data/jobs.json; then
            echo "No new data."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update data to $(jq -r .asOf data/jobs.json)" data/jobs.json
            git push
          fi
