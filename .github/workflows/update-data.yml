# Keeps the live site current. Every day it checks whether Job Bank or StatCan has published new
# data; if so, it commits the new data/jobs.json to main. Cloudflare (Workers Builds, connected to
# this repo) rebuilds and deploys the site on every push to main, including that one.
name: Update data

on:
  schedule:
    # Daily at 15:17 UTC: after StatCan's 8:30 a.m. ET releases (its tables can be locked
    # before then), and off the top of the hour, when GitHub's schedules are busiest.
    - cron: "17 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

      # open.canada.ca has outages. If the check can't reach the sources (exit code 2, a handful
      # of small requests), try again up to 3 more times, 10 minutes apart. If the download
      # itself fails, don't: that's about 140 MB, so it waits for tomorrow's run.
      - name: Download new data, if any
        run: |
          for attempt in 1 2 3 4; do
            status=0
            timeout 30m target/release/canada-job-tracker update || status=$?
            [ "$status" -eq 2 ] || exit "$status"
            if [ "$attempt" -lt 4 ]; then
              echo "::warning::Couldn't reach the data sources (try $attempt of 4); trying again in 10 minutes."
              sleep 600
            fi
          done
          echo "::error::Couldn't reach the data sources after 4 tries. Tomorrow's run will try again."
          exit 1

      - name: Commit new data
        run: |
          if git diff --quiet data/jobs.json; then
            echo "No new data."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update data to $(jq -r .asOf data/jobs.json)" data/jobs.json
            git push
          fi
